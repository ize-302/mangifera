# mango config for the SDDM greeter (installed to /etc/sddm/ by install.sh)

# QT_SCREEN_SCALE_FACTORS scales the greeter; mango's HiDPI guess would add to it
monitor_rule=name:.*,scale:1

border_px=0
gap_inner_horizontal=0
gap_inner_vertical=0
gap_outer_horizontal=0
gap_outer_vertical=0
animations=0
layer_animations=0
blur=0
shadows=0
auto_reload_config=0

cursor_theme=Adwaita
cursor_size=24

tap_to_click=1
trackpad_natural_scrolling=1
