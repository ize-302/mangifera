# Options: https://github.com/DreamMaoMao/mango/wiki/

# Window effect (layer/window rules at the end pick what gets blur and shadow)
blur=1
blur_layer=1
# On, popups over a window would blur the wallpaper instead of the window
blur_optimized=0
blur_params_num_passes = 3
blur_params_radius = 6
# Saturation above 1 makes the wallpaper glow through the menus
blur_params_noise = 0.06
blur_params_brightness = 1.0
blur_params_contrast = 1.0
blur_params_saturation = 1.0

# Shadow under the menus only
shadows = 1
layer_shadows = 1
shadow_only_floating = 1
shadows_size = 0
shadows_blur = 12
shadows_position_x = 0
shadows_position_y = 3
shadows_color= 0x00000059

border_radius=0
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

dim_enable=0
dim_focused_color=0x00000000
dim_unfocused_color=0x00000055

# Animations (type: zoom, slide; tag_animation_direction: 1 horizontal, 0 vertical)
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fade_in_begin_opacity=0.5
fade_out_begin_opacity=0.8
animation_duration_move=150
animation_duration_open=150
animation_duration_tag=150
animation_duration_close=120
animation_duration_focus=0
animation_curve_open=0.16,1,0.3,1
animation_curve_move=0.16,1,0.3,1
animation_curve_tag=0.16,1,0.3,1
animation_curve_close=0.16,1,0.3,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opacity_fade_out=0.5,0.5,0.5,0.5
animation_curve_opacity_fade_in=0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=1
default_master_factor=0.55
default_master_count=1
tag_num=9
smart_gaps=0

# Dwindle Layout Setting
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_horizontal_split=1
dwindle_vertical_split=1
dwindle_preserve_split=0

# Monocle Layout Setting
monocle_tab_mode=1
monocle_no_border=0
monocle_no_gap=0

# Deck Layout Setting
deck_tab_mode=1

# Overview Setting
hotarea_size=10
enable_hotarea=0
hotarea_disable_on_fullscreen=1
overview_gap_inner=5
overview_gap_outer=30
overcircle_center_ratio=0.5
title_message_bar_height=52
title_message_bar_gap=20

# Misc
no_border_when_single=1
axis_bind_apply_timeout=100
focus_on_activate=1
idle_inhibit_ignore_visible=0
idle_inhibit_when_fullscreen=1
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
focus_direction_only_zone_overlap=1
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
float_full_to_top=0
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1

# keyboard
repeat_rate=25
repeat_delay=600
numlock_on=0
xkb_rules_layout=us

# Trackpad (needs relogin)
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1

# Mouse (needs relogin)
mouse_natural_scrolling=0

# Appearance
gap_inner_horizontal=5
gap_inner_vertical=5
gap_outer_horizontal=5
gap_outer_vertical=5
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
border_px=2
root_color=0x201b14ff
border_color=0x444444ff
drop_color=0x8FBA7C55
split_color=0xEB441EFF
# Same as Theme.accentColor in the launcher
focus_color=0xff7518ff
maximized_screen_color=0x89aa61ff
urgent_color=0xad401fff
scratchpad_color=0x516c93ff
global_color=0xb153a7ff
overlay_color=0x14a57cff

# Layouts: tile, scroller, grid, deck, monocle, center_tile, vertical_tile, vertical_scroller
tag_rule=id:1,layout_name:tile
tag_rule=id:2,layout_name:tile
tag_rule=id:3,layout_name:tile
tag_rule=id:4,layout_name:tile
tag_rule=id:5,layout_name:tile
tag_rule=id:6,layout_name:tile
tag_rule=id:7,layout_name:tile
tag_rule=id:8,layout_name:tile
tag_rule=id:9,layout_name:tile

# Electron apps on Wayland, not blurry XWayland when scaled
env=ELECTRON_OZONE_PLATFORM_HINT,auto

# Startup
exec_once=~/.local/bin/wallpaper

exec_once=waybar
exec_once=~/.local/bin/bar-tags

# Menus, panels, OSD, notifications and the polkit agent
exec_once=qs -c launcher -d

# Clipboard history
exec_once=wl-paste --type text --watch cliphist store
exec_once=wl-paste --type image --watch cliphist store

# Lock after 15 minutes idle and before sleep
exec_once=swayidle -w timeout 900 '~/.local/bin/lock-screen' before-sleep '~/.local/bin/lock-screen'

# Focus windows that ask for attention
exec_once=~/.local/bin/focus-urgent

# Focus the external display when connected, else the laptop's
exec_once=~/.local/bin/primary-output alacritty

# Login sound. Wait for a real sink: pipewire only gets the card at login
exec_once=sh -c 'for i in $(seq 50); do pactl get-default-sink | grep -qv auto_null && break; sleep 0.2; done; paplay /usr/share/sounds/freedesktop/stereo/service-login.oga'

# No nm-applet: it would take Wi-Fi password requests from the control panel

# No blueman tray icon (ShowConnected depends on StatusIcon)
exec_once=gsettings set org.blueman.general plugin-list "['!StatusIcon', '!ShowConnected']"

# GTK on Wayland reads these from gsettings, not settings.ini
exec=gsettings set org.gnome.desktop.interface gtk-theme 'adw-gtk3-dark'
exec=gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
exec=gsettings set org.gnome.desktop.interface icon-theme 'Papirus-Dark'

# Key Bindings
# The comment right above a binding is its label in the cheat sheet (Super+F1);
# "#", "# Name:", "#" blocks are its sections. Key names: see `wev`

# Binds in 'common' apply in every mode
key_mode=common

# Reload the configuration
bind=SUPER+SHIFT,r,reload_config

key_mode=default

# Power menu
bind=SUPER,Escape,spawn,~/.local/bin/power-menu

# A different random wallpaper
bind=SUPER+SHIFT,w,spawn,~/.local/bin/wallpaper --random

# Open a terminal
bind=SUPER,Return,spawn,alacritty

# Open the file manager
bind=SUPER,e,spawn,thunar

# Screenshot of an area (drag) or a whole screen (click), opened in swappy to
# mark up, save (to ~/Pictures/Screenshots) or copy. Pressing it again while
# picking cancels
bind=SUPER,s,spawn,~/.local/bin/screenshot

# Record an area, picking the sound first (none, desktop, mic or both), or
# stop the recording
bind=SUPER+SHIFT,s,spawn,~/.local/bin/record-menu

# Show or hide the webcam widget, for screen recordings
bind=SUPER+SHIFT,c,spawn,~/.local/bin/cam-toggle

# Move the focused window to the scratchpad
bind=SUPER,BackSpace,minimized,

# Close the focused window
bind=SUPER,x,killclient,

# Open the app launcher
bind=SUPER,space,spawn,~/.local/bin/app-menu

# Clipboard history picker
bind=SUPER,c,spawn,~/.local/bin/clipboard-menu

# Key bindings cheat sheet
bind=SUPER,F1,spawn,~/.local/bin/keybind-menu

# Sound: what's playing, and the output and input volume
bind=SUPER,a,spawn,~/.local/bin/control-panel

# Notifications
bind=SUPER+SHIFT,n,spawn,~/.local/bin/notification-center

# Network connections
bind=SUPER,n,spawn,nm-connection-editor

# Bluetooth devices
bind=SUPER+SHIFT,b,spawn,blueman-manager

# Exit mango
bind=SUPER+SHIFT,e,spawn,mangonag -t warning -m 'You pressed the exit shortcut. Do you really want to exit mango? This will end your Wayland session.' -Z 'Yes, exit mango' 'mmsg dispatch quit'

#
# Moving around:
#
# Previous/next tag
bind=SUPER,h,viewtoleft
bind=SUPER,l,viewtoright

# Move the focus around
bind=SUPER+ALT,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER+ALT,l,focusdir,right
bind=SUPER,Left,focusdir,left
bind=SUPER,Down,focusdir,down
bind=SUPER,Up,focusdir,up
bind=SUPER,Right,focusdir,right

# Move the focused window with the same, but add Shift
bind=SUPER+SHIFT,h,move_client,left
bind=SUPER+SHIFT,j,move_client,down
bind=SUPER+SHIFT,k,move_client,up
bind=SUPER+SHIFT,l,move_client,right
bind=SUPER+SHIFT,Left,move_client,left
bind=SUPER+SHIFT,Down,move_client,down
bind=SUPER+SHIFT,Up,move_client,up
bind=SUPER+SHIFT,Right,move_client,right

#
# Tags:
#
# Switch to tag (mango's workspaces)
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# Move the focused window to tag, and follow it
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

#
# Layout:
#
# Split the next window side by side (dwindle layout only)
bind=SUPER,b,dwindle_split_horizontal

# Split the next window one above the other (dwindle layout only)
bind=SUPER,v,dwindle_split_vertical

# Make the focused window fullscreen
bind=SUPER,f,togglefullscreen,

# Toggle between tiling and floating
bind=SUPER+SHIFT,space,togglefloating,

# Next layout (tile, scroller, grid, ...)
bind=SUPER,Tab,switch_layout

# Overview of all windows
bind=SUPER,o,toggleoverview,

#
# Scratchpad:
#
# Scratchpad windows (double tap Super)
bindr=SUPER,Super_L,spawn,~/.local/bin/scratchpad-menu --tap

#
# Resizing windows:
#
# Resize mode
bind=SUPER,r,setkeymode,resize

key_mode=resize

# Shrink or grow the focused window: left and up shrink, right and down grow
bind=NONE,h,resizewin,-10,+0
bind=NONE,j,resizewin,+0,+10
bind=NONE,k,resizewin,+0,-10
bind=NONE,l,resizewin,+10,+0
bind=NONE,Left,resizewin,-10,+0
bind=NONE,Down,resizewin,+0,+10
bind=NONE,Up,resizewin,+0,-10
bind=NONE,Right,resizewin,+10,+0

# Leave resize mode
bind=NONE,Return,setkeymode,default

# Leave resize mode
bind=NONE,Escape,setkeymode,default

# Leave resize mode
bind=SUPER,r,setkeymode,default

key_mode=common

#
# Utilities:
#
# bindl: works on the lock screen. bindls: matched by keysym, as most
# layouts put Pause on the Play key

# Volume up
bindl=NONE,XF86AudioRaiseVolume,spawn_shell,wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 1%+ && paplay /usr/share/sounds/freedesktop/stereo/audio-volume-change.oga

# Volume down
bindl=NONE,XF86AudioLowerVolume,spawn_shell,wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%- && paplay /usr/share/sounds/freedesktop/stereo/audio-volume-change.oga

# Mute
bindl=NONE,XF86AudioMute,spawn,pactl set-sink-mute @DEFAULT_SINK@ toggle

# Mute the microphone
bindl=NONE,XF86AudioMicMute,spawn,pactl set-source-mute @DEFAULT_SOURCE@ toggle

# Brightness down
bindl=NONE,XF86MonBrightnessDown,spawn,brightnessctl --min-val=1 -q set 3%-

# Brightness up
bindl=NONE,XF86MonBrightnessUp,spawn,brightnessctl -q set 3%+

# Play or pause
bindls=NONE,XF86AudioPlay,spawn,playerctl play-pause

# Play or pause
bindls=NONE,XF86AudioPause,spawn,playerctl play-pause

# Previous track
bindl=NONE,XF86AudioPrev,spawn,playerctl previous

# Next track
bindl=NONE,XF86AudioNext,spawn,playerctl next

# Stop playback
bindl=NONE,XF86AudioStop,spawn,playerctl stop

# Screenshot of the whole screen
bind=NONE,Print,spawn,grim

key_mode=default

# Super+drag moves, Super+right drag resizes
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# Super+mouse side buttons switch tags: back to the previous, forward to the
# next. Without Super they stay browser back and forward.
mousebind=SUPER,btn_side,viewtoleft
mousebind=SUPER,btn_extra,viewtoright

# Four fingers switch tags
gesturebind=none,left,4,viewtoright
gesturebind=none,right,4,viewtoleft

# Four fingers up open the scratchpad menu, down close it
gesturebind=none,up,4,spawn,~/.local/bin/scratchpad-menu --open
gesturebind=none,down,4,spawn,~/.local/bin/scratchpad-menu --close

# Turn the laptop screen off with the lid closed
switchbind=fold,spawn,wlr-randr --output eDP-1 --off
switchbind=unfold,spawn,wlr-randr --output eDP-1 --on

# Blur behind the launcher, shadow under the menus only
layer_rule=no_blur:1,no_shadow:1,layer_name:^(?!(launcher|launcher-shadow)$)
layer_rule=no_shadow:1,layer_name:^launcher$

# Launcher surfaces appear at once
layer_rule=no_animation:1,layer_name:^launcher

window_rule=no_blur:1,no_shadow:1,app_id:.*

# btop (~/.local/bin/btop-toggle) as a named scratchpad
window_rule=is_named_scratchpad:1,width:1600,height:1000,app_id:^btop$

# Browser picture-in-picture floats on top and follows across tags
window_rule=is_floating:1,is_global:1,is_overlay:1,width:640,height:360,title:^Picture[- ]in[- ][Pp]icture$

# Machine-specific settings, not in the repo
source_optional=./local.conf
