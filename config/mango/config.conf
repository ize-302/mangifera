# More option see https://github.com/DreamMaoMao/mango/wiki/

# Window effect
blur=0
blur_layer=0
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadows_color= 0x000000ff

border_radius=0
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

dim_enable=0
dim_focused_color=0x00000000
dim_unfocused_color=0x00000055

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fade_in_begin_opacity=0.5
fade_out_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=800
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opacity_fade_out=0.5,0.5,0.5,0.5
animation_curve_opacity_fade_in=0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=1
default_master_factor=0.55
default_master_count=1
tag_num=9
smart_gaps=0

# Dwindle Layout Setting
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_horizontal_split=1
dwindle_vertical_split=1
dwindle_preserve_split=0

# Monocle Layout Setting
monocle_tab_mode=1
monocle_no_border=0
monocle_no_gap=0

# Deck Layout Setting
deck_tab_mode=1

# Overview Setting
hotarea_size=10
enable_hotarea=0
hotarea_disable_on_fullscreen=1
overview_gap_inner=5
overview_gap_outer=30
overcircle_center_ratio=0.5
title_message_bar_height=52
title_message_bar_gap=20

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idle_inhibit_ignore_visible=0
idle_inhibit_when_fullscreen=0
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
focus_direction_only_zone_overlap=1
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
float_full_to_top=0
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1

# keyboard
repeat_rate=25
repeat_delay=600
numlock_on=0
xkb_rules_layout=us

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0

# Appearance
gap_inner_horizontal=5
gap_inner_vertical=5
gap_outer_horizontal=10
gap_outer_vertical=10
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
border_px=2
root_color=0x201b14ff
border_color=0x444444ff
drop_color=0x8FBA7C55
split_color=0xEB441EFF
focus_color=0xc9b890ff
maximized_screen_color=0x89aa61ff
urgent_color=0xad401fff
scratchpad_color=0x516c93ff
global_color=0xb153a7ff
overlay_color=0x14a57cff

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tag_rule=id:1,layout_name:tile
tag_rule=id:2,layout_name:tile
tag_rule=id:3,layout_name:tile
tag_rule=id:4,layout_name:tile
tag_rule=id:5,layout_name:tile
tag_rule=id:6,layout_name:tile
tag_rule=id:7,layout_name:tile
tag_rule=id:8,layout_name:tile
tag_rule=id:9,layout_name:tile

# Key Bindings
# Mirrors swarch's sway config (~/swarch/config/sway/config): Super is the
# mod key, h/j/k/l or the arrows move around.
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# Binds in 'common' apply in every mode, the resize mode too
key_mode=common

# Reload the configuration
bind=SUPER+SHIFT,r,reload_config

key_mode=default

# Power menu
# bind=SUPER,Escape,spawn,~/.local/bin/power-menu

# Next wallpaper
bind=SUPER+SHIFT,w,spawn,~/.local/bin/wallpaper --random

# Terminal
bind=SUPER,Return,spawn,alacritty

# File manager
bind=SUPER,e,spawn,thunar

# Screenshot
bind=SUPER,s,spawn,~/.local/bin/screenshot

# Start or stop recording the screen
bind=SUPER+SHIFT,s,spawn,~/.local/bin/record-toggle --desktop

# Send the focused window to the scratchpad
bind=SUPER,BackSpace,minimized,

# Bring a window back from the scratchpad (sway's double tap Super menu
# listens on sway IPC, so it doesn't open here)
bind=SUPER+SHIFT,BackSpace,restore_minimized

# Close the focused window
bind=SUPER,x,killclient,

# App launcher
# bind=SUPER,space,spawn,~/.local/bin/app-menu

# Clipboard history
# bind=SUPER,c,spawn,~/.local/bin/clipboard-menu

# Key bindings cheat sheet
# bind=SUPER,F1,spawn,~/.local/bin/keybind-menu

# Control panel
# bind=SUPER,a,spawn,~/.local/bin/control-panel

# Notification center
# bind=SUPER+SHIFT,n,spawn,~/.local/bin/notification-center

# Network settings
bind=SUPER,n,spawn,nm-connection-editor

# Bluetooth settings
bind=SUPER+SHIFT,b,spawn,blueman-manager

# Exit mango
bind=SUPER+SHIFT,e,spawn,mangonag -t warning -m 'You pressed the exit shortcut. Do you really want to exit mango? This will end your Wayland session.' -Z 'Yes, exit mango' 'mmsg dispatch quit'

# Move focus
bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right
bind=SUPER,Left,focusdir,left
bind=SUPER,Down,focusdir,down
bind=SUPER,Up,focusdir,up
bind=SUPER,Right,focusdir,right

# Move the focused window
bind=SUPER+SHIFT,h,move_client,left
bind=SUPER+SHIFT,j,move_client,down
bind=SUPER+SHIFT,k,move_client,up
bind=SUPER+SHIFT,l,move_client,right
bind=SUPER+SHIFT,Left,move_client,left
bind=SUPER+SHIFT,Down,move_client,down
bind=SUPER+SHIFT,Up,move_client,up
bind=SUPER+SHIFT,Right,move_client,right

# Switch to tag (sway's workspace)
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# Move the focused window to tag
# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# Split the next window side by side, or one above the other (dwindle
# layout only)
bind=SUPER,b,dwindle_split_horizontal
bind=SUPER,v,dwindle_split_vertical

# Fullscreen
bind=SUPER,f,togglefullscreen,

# Toggle floating
bind=SUPER+SHIFT,space,togglefloating,

# Mango's own, which sway doesn't have

# Next layout (tile, scroller, grid, ...)
bind=SUPER,Tab,switch_layout

# Overview of all windows
bind=SUPER,o,toggleoverview,

# Resize mode
bind=SUPER,r,setkeymode,resize

key_mode=resize
bind=NONE,h,resizewin,-10,+0
bind=NONE,j,resizewin,+0,+10
bind=NONE,k,resizewin,+0,-10
bind=NONE,l,resizewin,+10,+0
bind=NONE,Left,resizewin,-10,+0
bind=NONE,Down,resizewin,+0,+10
bind=NONE,Up,resizewin,+0,-10
bind=NONE,Right,resizewin,+10,+0

# Leave resize mode
bind=NONE,Return,setkeymode,default
bind=NONE,Escape,setkeymode,default
bind=SUPER,r,setkeymode,default

key_mode=common

# Special keys, which work on the lock screen too (l). Volume up stops at
# 100% (-l 1.0): past that PipeWire boosts the signal in software, which
# distorts.
bindl=NONE,XF86AudioRaiseVolume,spawn_shell,wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+ && paplay /usr/share/sounds/freedesktop/stereo/audio-volume-change.oga
bindl=NONE,XF86AudioLowerVolume,spawn_shell,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && paplay /usr/share/sounds/freedesktop/stereo/audio-volume-change.oga
bindl=NONE,XF86AudioMute,spawn,pactl set-sink-mute @DEFAULT_SINK@ toggle
bindl=NONE,XF86AudioMicMute,spawn,pactl set-source-mute @DEFAULT_SOURCE@ toggle
bindl=NONE,XF86MonBrightnessDown,spawn,brightnessctl --min-val=1 -q set 3%-
bindl=NONE,XF86MonBrightnessUp,spawn,brightnessctl -q set 3%+
bindl=NONE,XF86AudioPlay,spawn,playerctl play-pause
bindl=NONE,XF86AudioPrev,spawn,playerctl previous
bindl=NONE,XF86AudioNext,spawn,playerctl next
bindl=NONE,XF86AudioStop,spawn,playerctl stop

# Screenshot of the whole screen
bind=NONE,Print,spawn,grim

key_mode=default

# Mouse Button Bindings: Super and drag moves a window, Super and right drag
# resizes it
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# Gesture Bindings: four fingers switch tags
gesturebind=none,left,4,viewtoright
gesturebind=none,right,4,viewtoleft

# Turn the laptop screen off with the lid closed
switchbind=fold,disable_monitor,eDP-1
switchbind=unfold,enable_monitor,eDP-1


# layer rule
layer_rule=animation_type_open:zoom,layer_name:rofi
layer_rule=animation_type_close:zoom,layer_name:rofi

# Your own settings for this machine (displays, keyboard), kept out of the repo
source_optional=./local.conf
