# "Noise Canceling" mic: the headset jack's mic run through RNNoise
# (noise-suppression-for-voice) to cut fans, keys and room hum
context.modules = [
  {
    name = libpipewire-module-filter-chain
    # Start without the mic if the plugin isn't installed
    flags = [ nofail ]
    args = {
      node.description = "Noise Canceling"
      media.name = "Noise Canceling"
      filter.graph = {
        nodes = [
          {
            type = ladspa
            name = rnnoise
            plugin = /usr/lib/ladspa/librnnoise_ladspa.so
            label = noise_suppressor_mono
            control = {
              # Below this voice likelihood (%) a frame is muted. 50 cut
              # quiet syllables and made speech choppy
              "VAD Threshold (%)" = 20.0
              # Keep sound this long after speech stops, so words aren't cut
              "VAD Grace Period (ms)" = 500
              # And this long before it starts, so the first sound isn't cut
              "Retroactive VAD Grace (ms)" = 60
            }
          }
          {
            # The headset mic's hardware gain is already at max, so +6 dB
            # more here. 2.5 (+8 dB) clipped loud speech
            type = builtin
            name = gain
            label = linear
            control = { "Mult" = 2.0 }
          }
        ]
        links = [
          { output = "rnnoise:Output" input = "gain:In" }
        ]
      }
      capture.props = {
        node.name = "capture.rnnoise_source"
        node.passive = true
        # Not the default mic: with this mic as the default, that falls back
        # to whichever mic was picked before it
        target.object = "alsa_input.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Mic2__source"
        audio.rate = 48000
        # Stereo, so the mono graph runs once per channel. A mono output
        # only reaches a stereo recorder's left channel
        audio.channels = 2
        audio.position = [ FL FR ]
      }
      playback.props = {
        node.name = "rnnoise_source"
        media.class = Audio/Source
        audio.rate = 48000
        audio.channels = 2
        audio.position = [ FL FR ]
      }
    }
  }
]
