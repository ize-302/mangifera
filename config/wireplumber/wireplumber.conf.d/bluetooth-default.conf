# Bluetooth outputs become the default sink when they connect
# (scripts/bluetooth-default.lua)
wireplumber.components = [
  {
    name = bluetooth-default.lua, type = script/lua
    provides = custom.bluetooth-default
    requires = [ metadata.default ]
  }
]

wireplumber.profiles = {
  main = {
    custom.bluetooth-default = required
  }
}
